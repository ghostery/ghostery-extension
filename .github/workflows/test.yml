name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.tool-versions'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.tool-versions'
      - name: Install dependencies
        run: npm ci
      - name: Unit Tests
        run: npm run test:unit

  e2e-chrome-group:
    name: e2e-chrome (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.tool-versions'
      - name: Install dependencies
        run: npm ci
      - name: Run tests with flags
        run: npm run wdio -- --target=chrome --group=${{ matrix.group }}

  # Required status check, which passes only if all spec groups pass
  e2e-chrome:
    runs-on: ubuntu-latest
    needs: e2e-chrome-group
    if: always()
    steps:
      - run: test "${{ needs.e2e-chrome-group.result }}" = "success"

  e2e-chrome-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.tool-versions'
      - name: Install dependencies
        run: npm ci
      - name: Run tests after updating the extension
        run: npm run wdio:update -- --target=chrome

  e2e-firefox-group:
    name: e2e-firefox (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.tool-versions'
      - name: Install dependencies
        run: npm ci
      - name: Run tests with flags
        run: npm run wdio -- --target=firefox --group=${{ matrix.group }}

  # Required status check, which passes only if all spec groups pass
  e2e-firefox:
    runs-on: ubuntu-latest
    needs: e2e-firefox-group
    if: always()
    steps:
      - run: test "${{ needs.e2e-firefox-group.result }}" = "success"

  e2e-firefox-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.tool-versions'
      - name: Install dependencies
        run: npm ci
      - name: Run tests after updating the extension
        run: npm run wdio:update -- --target=firefox
